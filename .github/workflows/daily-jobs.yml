name: Application Center Daily Job Search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - job_search.py
      - config/sources.json
      - config/role_profiles.json
      - tests/**
      - .github/workflows/daily-jobs.yml
  schedule:
    # Two UTC candidates; Python only accepts Berlin 08:00 for schedule events.
    - cron: '13 6,7 * * *'
permissions:
  contents: read
concurrency:
  group: application-center-daily
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Fetch, screen and synchronize vacancies
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python job_search.py --scheduled --limit 30
          else
            python job_search.py --limit 30
          fi
