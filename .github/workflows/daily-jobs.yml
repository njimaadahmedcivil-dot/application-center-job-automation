name: Application Center Daily Job Search
on:
  workflow_dispatch:
  schedule:
    # Both candidate UTC hours; Python runs only when Berlin local hour is 08.
    # GitHub scheduled runs can be delayed.
    - cron: '13 6,7 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Search and synchronize to Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python job_search.py --scheduled --limit 30
