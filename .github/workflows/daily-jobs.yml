name: Application Center Daily Job Search
on:
  workflow_dispatch:
  schedule:
    # Two UTC candidates; Python skips the run outside Berlin 08:00.
    - cron: '13 6,7 * * *'
permissions:
  contents: read
concurrency:
  group: application-center-daily
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Search jobs and synchronize to Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python job_search.py --scheduled --limit 30
          else
            python job_search.py --limit 30
          fi
